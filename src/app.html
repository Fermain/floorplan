<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The same shell serves every address, so these describe the site as a whole; each page sets its own title. -->
    <title>Floorplan: house design, priced and checked as you draw</title>
    <meta
      name="description"
      content="Design a small house brick by brick in your browser. Floorplan gives you a bill of quantities and SANS 10400 checks as you draw. No account; your projects stay on your machine."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Floorplan" />
    <meta property="og:url" content="https://floorplan.ferma.in/" />
    <meta property="og:title" content="Floorplan: house design, priced and checked as you draw" />
    <meta
      property="og:description"
      content="Draw a house on a real plot in real bricks and blocks, and get a bill of quantities and SANS 10400 checks as you go. Free, in your browser, with no account."
    />
    <meta property="og:image" content="https://floorplan.ferma.in/shots/plan.jpg" />
    <meta property="og:image:width" content="1456" />
    <meta property="og:image:height" content="763" />
    <meta
      property="og:image:alt"
      content="Plan of three houses, two carports and a garage round a gravel yard, with named rooms and paving"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Floorplan: house design, priced and checked as you draw" />
    <meta
      name="twitter:description"
      content="Draw a house on a real plot in real bricks and blocks, and get a bill of quantities and SANS 10400 checks as you go."
    />
    <meta name="twitter:image" content="https://floorplan.ferma.in/shots/plan.jpg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
